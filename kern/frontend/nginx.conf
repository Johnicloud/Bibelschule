server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://kern:8000;
    proxy_set_header Host $host;
    # Standard-Timeout (60s) reicht nicht für Weiterleitungen, die auf Ollama warten (bis zu 180s, siehe
    # aufgabenleser/pdfcreator) – sonst kappt nginx die Verbindung, bevor der Kern selbst antworten könnte.
    proxy_read_timeout 200s;
    proxy_send_timeout 200s;
  }

  location / {
    try_files $uri /index.html;
  }
}
