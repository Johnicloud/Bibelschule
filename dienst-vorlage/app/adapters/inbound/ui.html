<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__LABEL__</title>
<link rel="stylesheet" href="/ui-kit.css">
</head>
<body class="ui-kit">
<!-- Diese Seite erscheint als Reiter im Fach. Sie wird als /api/__NAME__/ui?subject=<Fach-ID> geladen,
     darum zeigen die relativen Adressen unten (items) auf den eigenen Dienst. Knopf, Eingabefeld und Liste
     kommen aus /ui-kit.css und /ui-kit.js, damit jeder neue Dienst dieselbe Oberfläche bekommt. -->
<form id="form" class="uk-form">
  <input id="text" class="uk-input" placeholder="Neuer Eintrag" aria-label="Neuer Eintrag" autocomplete="off">
  <button class="uk-btn">Hinzufügen</button>
</form>
<p id="fehler" class="uk-error" role="alert"></p>
<ul id="liste" class="uk-list"></ul>
<script src="/ui-kit.js"></script>
<script>
  const { call, el, renderList, subjectId } = UIKit
  const subject = subjectId()
  const fehler = document.getElementById('fehler')
  const liste = document.getElementById('liste')

  function zeile(item) {
    return el('li', { class: 'uk-list-item' }, [
      item.text,
      el('button', { class: 'uk-btn-danger', onclick: async () => { await call('DELETE', 'items/' + item.id); laden() } }, 'Löschen'),
    ])
  }
  async function laden() {
    renderList(liste, await call('GET', 'items?subject_id=' + encodeURIComponent(subject)), zeile)
  }
  document.getElementById('form').onsubmit = async (e) => {
    e.preventDefault(); fehler.textContent = ''
    const text = document.getElementById('text')
    try {
      await call('POST', 'items', { subject_id: subject, text: text.value })
      text.value = ''; await laden()
    } catch (err) { fehler.textContent = err.message }
  }
  laden().catch((err) => { fehler.textContent = err.message })
</script>
</body>
</html>
