networks:
  # Der ollama-Container läuft im eigenen Docker-Netzwerk "ki" (eigenständig gestartet, nicht Teil dieses
  # Compose-Stacks). pdfcreator/aufgabenleser hängen zusätzlich an diesem Netzwerk, um ihn unter dem Namen
  # "ollama" zu erreichen (OLLAMA_URL). Läuft Ollama bei dir stattdessen über host.docker.internal (eigene
  # Ollama.app mit Portfreigabe), einfach OLLAMA_URL in .env setzen – das übersteuert diesen Default.
  ki:
    external: true
