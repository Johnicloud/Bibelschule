services:
  adressbuch:
    build: ./adressbuch
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://adressbuch:8000
    volumes:
      - ./data/adressbuch:/app/data
    restart: unless-stopped
  skripte:
    build: ./skripte
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://skripte:8000
    volumes:
      - ./data/skripte:/app/data
    restart: unless-stopped
  bibelverse:
    build: ./bibelverse
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://bibelverse:8000
    volumes:
      - ./data/bibelverse:/app/data
    restart: unless-stopped
  pdfcreator:
    build: ./pdfcreator
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://pdfcreator:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    volumes:
      - ./data/pdfcreator:/app/data
    restart: unless-stopped
  aufgabenleser:
    build: ./aufgabenleser
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://aufgabenleser:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    restart: unless-stopped
