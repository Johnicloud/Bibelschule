services:
  adressbuch:
    build: ./adressbuch
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://adressbuch:8000
    volumes:
      - ./data/adressbuch:/app/data
    restart: unless-stopped
  skripte:
    build: ./skripte
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://skripte:8000
    volumes:
      - ./data/skripte:/app/data
    restart: unless-stopped
  bibelverse:
    build: ./bibelverse
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://bibelverse:8000
    volumes:
      - ./data/bibelverse:/app/data
    restart: unless-stopped
  pdfcreator:
    build: ./pdfcreator
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://pdfcreator:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    volumes:
      - ./data/pdfcreator:/app/data
    networks: [default, ki]
    restart: unless-stopped
  aufgabenleser:
    build: ./aufgabenleser
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://aufgabenleser:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    networks: [default, ki]
    restart: unless-stopped
  bibel:
    build: ./bibel
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://bibel:8000
    volumes:
      - ./data/bibel:/app/data
    restart: unless-stopped
  bibliothek:
    build: ./bibliothek
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://bibliothek:8000
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-llama3.2-vision}
    volumes:
      - ./data/bibliothek:/app/data
    networks: [default, ki]
    restart: unless-stopped
  vorlesen:
    build: ./vorlesen
    environment:
      KERN_URL: http://kern:8000
      SERVICE_URL: http://vorlesen:8000
    restart: unless-stopped

networks:
  # Der ollama-Container läuft im eigenen Docker-Netzwerk "ki" (eigenständig gestartet, nicht Teil dieses
  # Compose-Stacks). pdfcreator/aufgabenleser hängen zusätzlich an diesem Netzwerk, um ihn unter dem Namen
  # "ollama" zu erreichen (OLLAMA_URL). Läuft Ollama bei dir stattdessen über host.docker.internal (eigene
  # Ollama.app mit Portfreigabe), einfach OLLAMA_URL in .env setzen – das übersteuert diesen Default.
  ki:
    external: true
