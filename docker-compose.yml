# Bibelschule: Kern + drei Dienste + Oberfläche. Start: docker compose up --build  ->  http://localhost:8170
services:
  kern:
    build: ./kern/backend
    environment:
      # Fest eingetragene Dienste (Name=URL). Weitere Dienste melden sich selbst an (siehe ./neuer-dienst.sh).
      SERVICES: karteikarten=http://karteikarten:8000,lesenachweis=http://lesenachweis:8000,register=http://register:8000
    volumes:
      - ./data/kern:/app/data            # Fächer
    depends_on: [karteikarten, lesenachweis, register]
    restart: unless-stopped

  karteikarten:
    build: ./karteikarten
    environment:
      EXTERNAL_SERVICE_URL: ${EXTERNAL_SERVICE_URL:-}
      EXTERNAL_SERVICE_TOKEN: ${EXTERNAL_SERVICE_TOKEN:-}
    volumes:
      - ./data:/app/data                 # wie in der alten App: ./data/decks.json bleibt der Speicherort deiner Karten
    restart: unless-stopped

  lesenachweis:
    build: ./lesenachweis
    environment:
      TZ: ${TZ:-Europe/Berlin}           # "heute" im Leseprotokoll gilt in deiner Zeitzone
      EXTERNAL_SERVICE_URL: ${EXTERNAL_SERVICE_URL:-}
      EXTERNAL_SERVICE_TOKEN: ${EXTERNAL_SERVICE_TOKEN:-}
    volumes:
      - ./data/lesenachweis:/app/data
    restart: unless-stopped

  register:
    build: ./register
    environment:
      EXTERNAL_SERVICE_URL: ${EXTERNAL_SERVICE_URL:-}
      EXTERNAL_SERVICE_TOKEN: ${EXTERNAL_SERVICE_TOKEN:-}
    volumes:
      - ./data/register:/app/data
    restart: unless-stopped

  frontend:
    build: ./kern/frontend
    ports:
      - "8170:80"
    depends_on: [kern]
    restart: unless-stopped
