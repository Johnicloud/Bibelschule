# Zusatz für den Betrieb auf Proxmox: Caddy davor (HTTPS), die App selbst nur noch intern erreichbar.
# Start:  docker compose -f docker-compose.yml -f docker-compose.override.yml -f deploy/proxmox/docker-compose.proxmox.yml up -d --build
services:
  frontend:
    ports: !override []          # nicht mehr direkt von außen (vorher 8170), nur über Caddy
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/proxmox/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
volumes:
  caddy_data:
  caddy_config:
