<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibelverse</title>
<link rel="stylesheet" href="/ui-kit.css">
<style>
  h2 { font-size: 1.05rem; font-weight: 600; margin: 1.5rem 0 .75rem; }
  h2:first-child { margin-top: 0; }
  .uk-lern { text-align: center; }
  .uk-ref { font-size: 1.3rem; font-weight: 600; margin-bottom: 1rem; }
  .uk-text { font-size: 1.1rem; line-height: 1.5; margin: 1rem 0; }
  .uk-modus { display: flex; gap: .5rem; justify-content: center; margin-bottom: 1rem; }
  .uk-modus button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
  .uk-richtig { color: #16a34a; font-weight: 600; }
  .uk-falsch { color: var(--danger); font-weight: 600; }
  .uk-sub { color: var(--muted); font-size: .85rem; }
  .uk-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .uk-stufe { display: inline-flex; align-items: center; border-radius: 999px; padding: .1rem .55rem;
    font-size: .72rem; font-weight: 600; background: var(--border); color: var(--muted); }
  .uk-stufe.uk-gelernt { background: rgba(22,163,74,.15); color: #16a34a; }
  .uk-fortschritt { margin-bottom: 1.25rem; }
  .uk-bearbeiten-form { display: grid; gap: .5rem; width: 100%; }
</style>
</head>
<body class="ui-kit">
<h2>Fällig zum Lernen</h2>
<div id="lern-leer" class="uk-empty" hidden>Nichts fällig. Alle Verse dieses Fachs und die allgemeinen sind aktuell gelernt.</div>
<div id="lern" class="uk-panel uk-lern" hidden>
  <div class="uk-modus">
    <button id="modus-aufdecken" type="button" aria-pressed="true">Aufdecken</button>
    <button id="modus-buchstaben" type="button" aria-pressed="false">Anfangsbuchstaben</button>
  </div>
  <div id="rest" class="uk-sub"></div>
  <div class="uk-ref" id="ref"></div>

  <div id="block-aufdecken">
    <button id="zeigen" class="uk-btn">Text zeigen</button>
    <p id="text-aufdecken" class="uk-text" hidden></p>
    <div id="bewertung" class="uk-modus" hidden>
      <button id="btn-falsch" class="uk-btn-danger">Falsch</button>
      <button id="btn-richtig" class="uk-btn">Richtig</button>
    </div>
  </div>

  <div id="block-buchstaben" hidden>
    <p class="uk-sub">Tipp die Anfangsbuchstaben jedes Wortes nacheinander, z. B. „DahGdWg...“ – wird sofort beim Tippen geprüft.</p>
    <input id="eingabe-buchstaben" class="uk-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Anfangsbuchstaben">
    <p id="ergebnis-buchstaben" style="margin-top:.6rem"></p>
    <p id="text-buchstaben" class="uk-text" hidden></p>
  </div>
</div>

<div id="fortschritt" class="uk-sub uk-fortschritt"></div>

<h2>Neuen Vers anlegen</h2>
<form id="form-neu" class="uk-panel" style="display:grid;gap:.6rem">
  <input id="n-ref" class="uk-input" placeholder="Bibelstelle, z. B. Joh 3,16" aria-label="Bibelstelle" required>
  <textarea id="n-text" class="uk-input" placeholder="Text des Verses" aria-label="Text des Verses" rows="3" required></textarea>
  <label style="display:flex;align-items:center;gap:.5rem">
    <input id="n-allgemein" type="checkbox"> allgemein (nicht nur für dieses Fach)
  </label>
  <button class="uk-btn" style="justify-self:start">Anlegen</button>
  <p id="fehler-neu" class="uk-error" role="alert"></p>
</form>

<h2>Verse dieses Fachs</h2>
<ul id="liste-fach" class="uk-list"></ul>

<h2>Allgemeine Verse</h2>
<ul id="liste-allgemein" class="uk-list"></ul>

<script src="/ui-kit.js"></script>
<script>
  const { call, el, subjectId } = UIKit
  const subject = subjectId()
  let warteschlange = []
  let modus = 'aufdecken'
  let zielBuchstaben = ''
  let buchstabenFalschGemeldet = false

  const INTERVALLE = [0, 1, 2, 4, 8, 16]

  function initialen(text) {
    return (text.match(/[\p{L}\p{N}]+/gu) || []).map((w) => w[0].toUpperCase()).join('')
  }
  // Eingabe ist schon eine Kette aus Anfangsbuchstaben (kein Leerzeichen zwischen den Wörtern) –
  // hier nur auf Buchstaben/Ziffern reduzieren und großschreiben, nicht wie initialen() wortweise gruppieren.
  function normiert(text) {
    return (text.match(/[\p{L}\p{N}]/gu) || []).join('').toUpperCase()
  }
  function formatDatum(iso) {
    return new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })
  }
  function stufenBadge(v) {
    const gelernt = v.box >= 4
    const label = v.box === 0 ? 'neu' : `Stufe ${v.box} (${INTERVALLE[v.box]} Tage)`
    return el('span', { class: 'uk-stufe' + (gelernt ? ' uk-gelernt' : '') }, gelernt ? 'sicher gelernt' : label)
  }

  function ansicht(v, zeile, erneutLaden) {
    const kontakt = el('div', { class: 'uk-row', style: 'width:100%' }, [
      el('div', {}, [
        el('div', {}, v.referenz),
        el('div', { class: 'uk-sub' }, v.text),
        el('div', { class: 'uk-sub', style: 'margin-top:.3rem;display:flex;gap:.5rem;align-items:center' }, [
          stufenBadge(v),
          v.faellig ? el('span', {}, 'fällig') : el('span', {}, `fällig am ${formatDatum(v.due)}`),
        ]),
      ]),
      el('div', { style: 'display:flex;gap:.4rem;flex-shrink:0' }, [
        el('button', { class: 'uk-btn-ghost', onclick: () => zeigeBearbeiten(zeile, v, erneutLaden) }, 'Bearbeiten'),
        el('button', { class: 'uk-btn-danger', onclick: async () => {
          if (!confirm(`Vers „${v.referenz}“ löschen?`)) return
          await call('DELETE', `verse/${v.id}`); erneutLaden()
        } }, 'Löschen'),
      ]),
    ])
    zeile.replaceChildren(kontakt)
  }

  function zeigeBearbeiten(zeile, v, erneutLaden) {
    const refFeld = el('input', { class: 'uk-input', value: v.referenz, 'aria-label': 'Bibelstelle' })
    const textFeld = el('textarea', { class: 'uk-input', rows: '2', 'aria-label': 'Text des Verses' }, v.text)
    const allgemeinFeld = el('input', { type: 'checkbox', ...(v.subject_id === null ? { checked: 'true' } : {}) })
    const fehler = el('p', { class: 'uk-error' })
    const form = el('div', { class: 'uk-bearbeiten-form' }, [
      refFeld, textFeld,
      el('label', { style: 'display:flex;align-items:center;gap:.4rem;font-size:.85rem' }, [allgemeinFeld, 'allgemein (nicht nur für dieses Fach)']),
      el('div', { style: 'display:flex;gap:.4rem' }, [
        el('button', { class: 'uk-btn', onclick: async () => {
          fehler.textContent = ''
          try {
            await call('PUT', `verse/${v.id}`, { referenz: refFeld.value, text: textFeld.value, subject_id: allgemeinFeld.checked ? null : subject })
            erneutLaden()
          } catch (err) { fehler.textContent = err.message }
        } }, 'Speichern'),
        el('button', { class: 'uk-btn-ghost', onclick: () => ansicht(v, zeile, erneutLaden) }, 'Abbrechen'),
      ]),
      fehler,
    ])
    zeile.replaceChildren(form)
  }

  function zeileVers(v, erneutLaden) {
    const zeile = el('li', { class: 'uk-list-item' })
    ansicht(v, zeile, erneutLaden)
    return zeile
  }

  async function ladenListen() {
    await ladenFortschritt()
    document.getElementById('liste-fach').replaceChildren(...(await call('GET', 'verse?subject_id=' + encodeURIComponent(subject))).map((v) => zeileVers(v, ladenAlles)))
    document.getElementById('liste-allgemein').replaceChildren(...(await call('GET', 'verse?allgemein=true')).map((v) => zeileVers(v, ladenAlles)))
  }

  async function ladenFortschritt() {
    const eigene = await call('GET', 'verse?subject_id=' + encodeURIComponent(subject))
    const anzeige = document.getElementById('fortschritt')
    if (!eigene.length) { anzeige.textContent = 'Noch kein Vers in diesem Fach.'; return }
    const gelernt = eigene.filter((v) => v.box >= 4).length
    anzeige.textContent = `${gelernt} von ${eigene.length} Versen dieses Fachs sicher gelernt (Stufe 4+).`
  }

  function zeigeLernkarte() {
    const leer = document.getElementById('lern-leer'), karte = document.getElementById('lern')
    if (!warteschlange.length) { leer.hidden = false; karte.hidden = true; return }
    leer.hidden = true; karte.hidden = false
    const v = warteschlange[0]
    document.getElementById('rest').textContent = `noch ${warteschlange.length} fällig`
    document.getElementById('ref').textContent = v.referenz

    document.getElementById('text-aufdecken').hidden = true
    document.getElementById('text-aufdecken').textContent = v.text
    document.getElementById('bewertung').hidden = true

    zielBuchstaben = initialen(v.text)
    buchstabenFalschGemeldet = false
    const eingabeFeld = document.getElementById('eingabe-buchstaben')
    eingabeFeld.value = ''
    eingabeFeld.disabled = false
    eingabeFeld.className = 'uk-input'
    document.getElementById('ergebnis-buchstaben').textContent = ''
    document.getElementById('ergebnis-buchstaben').className = ''
    document.getElementById('text-buchstaben').hidden = true
    if (modus === 'buchstaben') eingabeFeld.focus()
  }

  async function bewerten(correct) {
    const v = warteschlange.shift()
    await call('POST', `verse/${v.id}/review`, { correct })
    zeigeLernkarte()
  }

  function setzeModus(neu) {
    modus = neu
    document.getElementById('modus-aufdecken').setAttribute('aria-pressed', String(neu === 'aufdecken'))
    document.getElementById('modus-buchstaben').setAttribute('aria-pressed', String(neu === 'buchstaben'))
    document.getElementById('block-aufdecken').hidden = neu !== 'aufdecken'
    document.getElementById('block-buchstaben').hidden = neu !== 'buchstaben'
    if (neu === 'buchstaben') document.getElementById('eingabe-buchstaben').focus()
  }
  document.getElementById('modus-aufdecken').onclick = () => setzeModus('aufdecken')
  document.getElementById('modus-buchstaben').onclick = () => setzeModus('buchstaben')

  document.getElementById('zeigen').onclick = () => {
    document.getElementById('text-aufdecken').hidden = false
    document.getElementById('bewertung').hidden = false
  }
  document.getElementById('btn-richtig').onclick = () => bewerten(true)
  document.getElementById('btn-falsch').onclick = () => bewerten(false)

  // Prüft bei jedem Tastendruck, ob die bisherige Eingabe noch zum Vers passt (Anfangsbuchstaben-Modus).
  // Richtig und vollständig -> sofort bewertet, kurze Bestätigung, automatisch weiter zum nächsten Vers.
  // Falsch -> sofort als falsch bewertet (einmal), Text zur Kontrolle gezeigt, Eingabe geleert zum Wiederholen;
  // erst wenn der Vers danach richtig getippt wird, geht es weiter (ohne erneute Bewertung).
  document.getElementById('eingabe-buchstaben').oninput = async (e) => {
    if (!warteschlange.length) return
    const v = warteschlange[0]
    const feld = e.target
    const eingabe = normiert(feld.value)
    const ergebnis = document.getElementById('ergebnis-buchstaben')

    let abweichungAb = -1
    for (let i = 0; i < eingabe.length; i++) {
      if (i >= zielBuchstaben.length || eingabe[i] !== zielBuchstaben[i]) { abweichungAb = i; break }
    }

    if (abweichungAb !== -1) {
      feld.className = 'uk-input uk-falsch'
      if (!buchstabenFalschGemeldet) {
        buchstabenFalschGemeldet = true
        ergebnis.textContent = 'Falsch – noch einmal versuchen.'
        ergebnis.className = 'uk-falsch'
        document.getElementById('text-buchstaben').hidden = false
        document.getElementById('text-buchstaben').textContent = v.text
        await call('POST', `verse/${v.id}/review`, { correct: false })
      }
      feld.value = ''
      return
    }

    feld.className = 'uk-input'
    if (eingabe.length < zielBuchstaben.length) {
      if (!buchstabenFalschGemeldet) { ergebnis.textContent = ''; ergebnis.className = '' }
      return
    }

    // vollständig und richtig
    ergebnis.textContent = buchstabenFalschGemeldet ? 'Jetzt richtig – weiter.' : 'Richtig!'
    ergebnis.className = 'uk-richtig'
    feld.disabled = true
    if (!buchstabenFalschGemeldet) await call('POST', `verse/${v.id}/review`, { correct: true })
    warteschlange.shift()
    setTimeout(zeigeLernkarte, 700)
  }

  document.getElementById('form-neu').onsubmit = async (e) => {
    e.preventDefault()
    const fehler = document.getElementById('fehler-neu')
    fehler.textContent = ''
    const ref = document.getElementById('n-ref'), text = document.getElementById('n-text'), allgemein = document.getElementById('n-allgemein')
    try {
      await call('POST', 'verse', { referenz: ref.value, text: text.value, subject_id: allgemein.checked ? null : subject })
      ref.value = ''; text.value = ''; allgemein.checked = false
      await ladenAlles()
    } catch (err) { fehler.textContent = err.message }
  }

  async function ladenAlles() {
    warteschlange = await call('GET', 'verse/faellig?subject_id=' + encodeURIComponent(subject))
    zeigeLernkarte()
    await ladenListen()
  }

  ladenAlles().catch((err) => { document.getElementById('fehler-neu').textContent = err.message })
</script>
</body>
</html>
