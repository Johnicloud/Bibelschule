<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skripte</title>
<link rel="stylesheet" href="/ui-kit.css">
<style>
  .uk-list-item { flex-direction: column; align-items: stretch; }
  .uk-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .uk-sub { color: var(--muted); font-size: .85rem; }
  .uk-docx { background: #fff; color: #111; overflow: auto; max-height: 75vh; border: 1px solid var(--border); border-radius: .7rem; margin-top: .75rem; padding: .5rem; }
  .uk-fragen { margin-top: .75rem; display: grid; gap: .5rem; }
  .uk-frage { display: grid; grid-template-columns: auto 1fr; gap: .25rem .6rem; align-items: start; }
  .uk-frage input[type=text] { grid-column: 2; }
  iframe.uk-vorschau { width: 100%; height: 75vh; border: 1px solid var(--border); border-radius: .7rem; margin-top: .75rem; }
</style>
</head>
<body class="ui-kit">
<!-- Skripte dieses Fachs: hochladen, direkt im Browser lesen (PDF, Word .docx, Pages), Fragen als Karteikarten übernehmen, herunterladen, löschen. -->
<form id="form" class="uk-form">
  <input id="datei" class="uk-input" type="file" aria-label="Datei auswählen" required>
  <button class="uk-btn uk-icon-btn" id="hochladen" title="Hochladen" aria-label="Hochladen"></button>
</form>
<p id="fehler" class="uk-error" role="alert"></p>
<ul id="liste" class="uk-list"></ul>
<p id="leer" class="uk-empty" hidden>Noch kein Skript hochgeladen.</p>

<script src="/ui-kit.js"></script>
<script>
  const { call, el, subjectId, icon, setIcon } = UIKit
  const subject = subjectId()

  function groesse(bytes) {
    if (bytes > 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB'
    return Math.round(bytes / 1024) + ' KB'
  }

  // Word (.docx) kann der Browser nicht selbst anzeigen: docx-preview zeichnet es im Browser (Bibliotheken liegen
  // lokal unter /vendor, kein Fremdserver). Das alte .doc-Format kann sie nicht – das bleibt zum Herunterladen.
  const istDocx = (s) => /\.docx$/i.test(s.dateiname)
  const istDoc = (s) => /\.doc$/i.test(s.dateiname)
  const istPages = (s) => /\.pages$/i.test(s.dateiname)
  const kannFragen = (s) => /\.(pdf|docx|pages|png|jpe?g)$/i.test(s.dateiname)
  function skriptLaden(src) {
    return new Promise((ok, fehler) => {
      const t = document.createElement('script')
      t.src = src; t.onload = ok; t.onerror = () => fehler(new Error('Anzeige konnte nicht geladen werden.'))
      document.head.appendChild(t)
    })
  }
  let docxBereit = null
  function docxLaden() {
    docxBereit ||= skriptLaden('/vendor/jszip.min.js').then(() => skriptLaden('/vendor/docx-preview.min.js'))
    return docxBereit
  }

  document.getElementById('hochladen').append(icon('upload'), 'Hochladen')

  // Menü hinter den drei Punkten: immer nur eins offen, schließt beim Klick daneben oder mit Escape
  let offenesMenue = null
  const menueZu = () => { if (offenesMenue) { offenesMenue.hidden = true; offenesMenue = null } }
  document.addEventListener('click', menueZu)
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') menueZu() })

  function punkt(iconName, text, aktion, extra = '') {
    const inhalt = [icon(iconName), text]
    const knoten = typeof aktion === 'string'
      ? el('a', { class: 'uk-menu-item ' + extra, href: aktion, target: '_blank', rel: 'noopener' }, inhalt)
      : el('button', { class: 'uk-menu-item ' + extra, type: 'button' }, inhalt)
    if (typeof aktion === 'function') knoten.onclick = aktion
    return knoten
  }

  function zeile(s) {
    const url = `skripte/${s.id}/datei`
    const docx = istDocx(s)
    const vorschau = el(docx ? 'div' : 'iframe', { class: docx ? 'uk-docx' : 'uk-vorschau', hidden: 'true' })
    let geladen = false
    // Vorschau: ein Tipp auf den Namen klappt sie auf oder zu
    async function vorschauUmschalten() {
      const zu = vorschau.hidden
      vorschau.hidden = !zu
      if (!zu || geladen) return
      if (!docx) { if (!vorschau.src) vorschau.src = istPages(s) ? `skripte/${s.id}/vorschau` : url; return }
      try {
        vorschau.textContent = 'Lädt …'
        const [res] = await Promise.all([fetch(url), docxLaden()])
        if (!res.ok) throw new Error('Datei konnte nicht geladen werden.')
        vorschau.textContent = ''
        await window.docx.renderAsync(await res.blob(), vorschau)
        geladen = true
      } catch (err) { vorschau.textContent = 'Anzeige nicht möglich: ' + err.message }
    }
    const nameBtn = el('button', { class: 'uk-name', type: 'button', title: 'Vorschau ein-/ausblenden' }, s.dateiname)
    nameBtn.onclick = vorschauUmschalten
    if (istDoc(s)) { nameBtn.disabled = true; nameBtn.title = 'Altes .doc-Format: bitte herunterladen oder als .docx speichern' }

    const fragenBox = el('div', { class: 'uk-fragen', hidden: 'true' })
    async function kartenOeffnen() {
      if (!fragenBox.hidden) { fragenBox.hidden = true; return }
      fragenBox.hidden = false
      fragenBox.textContent = 'Liest die Datei …'
      try { kartenZeigen(fragenBox, s, await call('GET', `skripte/${s.id}/karten`)) }
      catch (err) { fragenBox.textContent = err.message }
    }

    // Gescannte PDFs haben keinen Text: erst „Text erkennen“ (OCR, dauert bei einem ganzen Skript einige Minuten,
    // läuft im Hintergrund), danach lässt sich in der Anzeige markieren und kopieren.
    const textInfo = el('span', { class: 'uk-sub', role: 'status' })
    const textPunkt = punkt('scan', 'Text erkennen', async () => {
      textPunkt.disabled = true
      try { const t = await call('POST', `skripte/${s.id}/text-erkennen`); textZeigen({ ...s, text_status: t.status, text_fehler: t.fehler }) }
      catch (err) { textInfo.textContent = err.message; textPunkt.disabled = false }
    })
    textPunkt.title = 'Gescanntes PDF durchsuchbar machen, damit sich Text markieren und kopieren lässt'
    const textZeigen = (t) => {
      textPunkt.hidden = t.text_status === 'fertig' || !/\.pdf$/i.test(s.dateiname)
      textPunkt.disabled = t.text_status === 'laeuft'
      textPunkt.replaceChildren(icon(t.text_status === 'laeuft' ? 'uhr' : 'scan'), t.text_status === 'laeuft' ? 'Text wird erkannt …' : 'Text erkennen')
      textInfo.textContent = t.text_status === 'fertig' ? 'Text markierbar' : t.text_status === 'fehler' ? (t.text_fehler || 'Texterkennung fehlgeschlagen.') : t.text_status === 'laeuft' ? 'Text wird erkannt …' : ''
      if (t.text_status === 'laeuft') setTimeout(textAbfragen, 5000)
    }
    const textAbfragen = async () => {
      try { textZeigen((await call('GET', 'skripte?subject_id=' + encodeURIComponent(subject))).find((x) => x.id === s.id) || s) } catch { /* nächster Versuch */ }
    }
    textZeigen(s)

    // Umbenennen: Name wird zum Eingabefeld (Enter speichert, Escape bricht ab); die Endung bleibt erhalten
    const kopf = el('div', {}, [nameBtn])
    function umbenennenStarten() {
      const feld = el('input', { class: 'uk-input', type: 'text', value: s.dateiname, 'aria-label': 'Neuer Dateiname' })
      const fehlerZeile = el('div', { class: 'uk-error', role: 'alert' })
      const fertig = async () => {
        try { await call('PUT', `skripte/${s.id}`, { dateiname: feld.value }); laden() }
        catch (err) { fehlerZeile.textContent = err.message }
      }
      feld.onkeydown = (e) => { if (e.key === 'Enter') fertig(); if (e.key === 'Escape') kopf.replaceChildren(nameBtn) }
      const ok = el('button', { class: 'uk-btn uk-icon-btn', type: 'button', onclick: fertig }); setIcon(ok, 'haken', 'Speichern')
      const nein = el('button', { class: 'uk-btn-ghost uk-icon-btn', type: 'button', onclick: () => kopf.replaceChildren(nameBtn) }); setIcon(nein, 'x', 'Abbrechen')
      kopf.replaceChildren(el('div', { style: 'display:flex;gap:.4rem;align-items:center' }, [feld, ok, nein]), fehlerZeile)
      feld.focus(); feld.select()
    }

    const menue = el('div', { class: 'uk-menu', hidden: 'true', role: 'menu' }, [
      ...(istDoc(s) ? [] : [punkt('extern', 'In neuem Tab öffnen', `skripte/${s.id}/${istPages(s) ? 'vorschau' : docx ? 'ansicht' : 'datei'}`)]),
      textPunkt,
      ...(kannFragen(s) ? [punkt('karten', 'Karten übernehmen', kartenOeffnen)] : []),
      punkt('stift', 'Umbenennen', umbenennenStarten),
      punkt('download', 'Herunterladen', () => { const a = el('a', { href: url + '?original=1', download: s.dateiname }); a.click() }),
      punkt('trash', 'Löschen', async () => {
        if (!confirm(`„${s.dateiname}“ löschen?`)) return
        await call('DELETE', `skripte/${s.id}`); laden()
      }, 'uk-menu-danger'),
    ])
    const mehrBtn = el('button', { class: 'uk-btn-ghost uk-icon-btn', type: 'button', 'aria-haspopup': 'menu' })
    setIcon(mehrBtn, 'mehr', 'Weitere Aktionen')
    mehrBtn.style.color = 'var(--text)'
    mehrBtn.onclick = (e) => {
      e.stopPropagation()
      const war = offenesMenue === menue
      menueZu()
      if (!war) { menue.hidden = false; offenesMenue = menue }
    }
    menue.onclick = () => menueZu()

    return el('li', { class: 'uk-list-item' }, [
      el('div', { class: 'uk-row' }, [
        el('div', {}, [kopf, el('div', { class: 'uk-sub' }, `${groesse(s.groesse)} · ${s.hochgeladen_am}`), textInfo]),
        el('div', { class: 'uk-menu-wrap' }, [mehrBtn, menue]),
      ]),
      fragenBox,
      vorschau,
    ])
  }

  // Die erkannten Karten sind nur ein Vorschlag: abwählen, Antwort eintragen oder ganz verwerfen geht vor dem Anlegen.
  // Karteikarten brauchen eine Rückseite – ohne eingetragene Antwort steht dort ein Platzhalter.
  // Alle übernommenen Karten bilden ein Set (Name frei wählbar, Vorgabe = Dateiname), das die Kartenliste filtern kann.
  const KARTEN = `/api/karteikarten/decks/${encodeURIComponent(subject)}/cards`
  const OHNE_ANTWORT = '(Antwort noch nicht eingetragen)'
  function kartenZeigen(box, s, erg) {
    const karten = erg.karten
    if (!karten.length) { box.textContent = 'Keine Fragen gefunden.'; return }
    const zeilen = karten.map((k) => {
      const haken = el('input', { type: 'checkbox', checked: 'true', 'aria-label': 'Karte übernehmen' })
      const antwort = el('input', { class: 'uk-input', type: 'text', placeholder: 'Antwort (optional, kann leer bleiben)', value: k.antwort })
      const frage = el('input', { class: 'uk-input', type: 'text', value: k.frage, 'aria-label': 'Frage' })   // Texterkennung kann sich irren: Frage lässt sich korrigieren
      return { frage, haken, antwort, node: el('div', { class: 'uk-frage' }, [haken, frage, antwort]) }
    })
    const setName = el('input', { class: 'uk-input', type: 'text', value: s.dateiname.replace(/\.[^.]+$/, ''), 'aria-label': 'Name des Sets' })
    const meldung = el('p', { class: 'uk-sub', role: 'status' })
    const anlegen = el('button', { class: 'uk-btn uk-icon-btn', title: 'Als Set speichern' })
    const verwerfen = el('button', { class: 'uk-btn-ghost uk-icon-btn', title: 'Erkannte Karten verwerfen, nichts wird angelegt' })
    verwerfen.append(icon('x'), 'Verwerfen')
    verwerfen.onclick = () => { box.hidden = true; box.replaceChildren() }
    const zaehlen = () => { const n = zeilen.filter((z) => z.haken.checked).length; anlegen.replaceChildren(icon('haken'), `${n} Karte${n === 1 ? '' : 'n'} als Set speichern`); anlegen.disabled = n === 0 }
    zeilen.forEach((z) => z.haken.addEventListener('change', zaehlen))
    zaehlen()
    anlegen.onclick = async () => {
      anlegen.disabled = true
      meldung.textContent = ''
      try {
        const vorhanden = new Set(((await call('GET', `/api/karteikarten/decks/${encodeURIComponent(subject)}`)).cards || []).map((c) => c.front))
        let neu = 0, doppelt = 0
        for (const z of zeilen.filter((z) => z.haken.checked)) {
          const f = z.frage.value.trim()
          if (!f) continue
          if (vorhanden.has(f)) { doppelt++; continue }
          await call('POST', KARTEN, { kind: 'classic', front: f, back: z.antwort.value.trim() || OHNE_ANTWORT, options: [], correct_index: null, set_name: setName.value.trim() })
          neu++
        }
        meldung.textContent = `${neu} Karte${neu === 1 ? '' : 'n'} gespeichert` + (doppelt ? `, ${doppelt} gab es schon.` : '.')
      } catch (err) { meldung.textContent = err.message }
      zaehlen()
    }
    const hinweis = erg.quelle === 'druckbogen' ? 'Druckbogen erkannt – Fragen und Antworten sind übernommen.' : 'Fragenliste erkannt – ohne Antworten.'
    box.replaceChildren(el('p', { class: 'uk-sub' }, `${karten.length} Karten: ${hinweis} Sie landen im Reiter „Karteikarten“ dieses Fachs.`),
      el('label', { class: 'uk-sub' }, 'Name des Sets'), setName,
      ...zeilen.map((z) => z.node), el('div', { style: 'display:flex;gap:.5rem' }, [anlegen, verwerfen]), meldung)
  }

  async function laden() {
    const skripte = await call('GET', 'skripte?subject_id=' + encodeURIComponent(subject))
    document.getElementById('liste').replaceChildren(...skripte.map(zeile))
    document.getElementById('leer').hidden = skripte.length > 0
  }

  document.getElementById('form').onsubmit = async (e) => {
    e.preventDefault()
    const fehler = document.getElementById('fehler')
    fehler.textContent = ''
    const feld = document.getElementById('datei')
    const datei = feld.files[0]
    if (!datei) return
    const formdata = new FormData()
    formdata.append('subject_id', subject)
    formdata.append('datei', datei)
    try {
      const res = await fetch('skripte', { method: 'POST', body: formdata })
      if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(typeof err.detail === 'string' ? err.detail : 'Hochladen fehlgeschlagen.') }
      feld.value = ''
      await laden()
    } catch (err) { fehler.textContent = err.message }
  }

  laden().catch((err) => { document.getElementById('fehler').textContent = err.message })
</script>
</body>
</html>
